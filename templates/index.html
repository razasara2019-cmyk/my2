<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الكيان الدستوري الحي</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            color: #fff;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid #e94560;
            margin-bottom: 30px;
        }
        
        header h1 {
            font-size: 2rem;
            color: #e94560;
            margin-bottom: 10px;
        }
        
        header p {
            color: #aaa;
        }
        
        .status {
            display: inline-block;
            padding: 5px 15px;
            background: #0f3460;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-top: 10px;
        }
        
        .chat-container {
            background: #0f3460;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .chat-messages {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: #16213e;
        }
        
        .message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        
        .user-message {
            align-items: flex-end;
        }
        
        .assistant-message {
            align-items: flex-start;
        }
        
        .message-bubble {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 20px;
            word-wrap: break-word;
            line-height: 1.5;
        }
        
        .user-message .message-bubble {
            background: #e94560;
            color: white;
            border-bottom-right-radius: 5px;
        }
        
        .assistant-message .message-bubble {
            background: #1a1a2e;
            color: #eee;
            border-bottom-left-radius: 5px;
        }
        
        .message-time {
            font-size: 0.7rem;
            color: #888;
            margin-top: 5px;
        }
        
        .chat-input-area {
            display: flex;
            padding: 20px;
            background: #0f3460;
            border-top: 1px solid #1a1a2e;
        }
        
        .chat-input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 25px;
            background: #16213e;
            color: white;
            font-size: 1rem;
            outline: none;
        }
        
        .chat-input::placeholder {
            color: #666;
        }
        
        .send-btn {
            margin-right: 10px;
            padding: 12px 25px;
            background: #e94560;
            border: none;
            border-radius: 25px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .send-btn:hover {
            transform: scale(1.02);
            background: #ff6b8a;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #e94560;
        }
        
        footer {
            text-align: center;
            padding: 30px;
            color: #555;
            font-size: 0.8rem;
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #0f3460;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #e94560;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛡️ الكيان الدستوري الحي</h1>
            <p>يتفكر. يتعلم. ينمو. الدستور هو هويته.</p>
            <div class="status" id="status">🟢 متصل</div>
        </header>
        
        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="message assistant-message">
                    <div class="message-bubble">
                        السلام عليكم. أنا الكيان الدستوري الحي.<br>
                        كيف يمكنني مساعدتك اليوم؟
                    </div>
                    <div class="message-time" id="welcomeTime"></div>
                </div>
            </div>
            
            <div class="loading" id="loading">
                <span>🤔 يتفكر...</span>
            </div>
            
            <div class="chat-input-area">
                <button class="send-btn" id="sendBtn">إرسال</button>
                <input type="text" class="chat-input" id="chatInput" placeholder="اكتب سؤالك هنا..." />
            </div>
        </div>
        
        <footer>
            <p>الدستور هو الهوية. الصمت واجب. التطور من الداخل.</p>
        </footer>
    </div>
    
    <script>
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const loading = document.getElementById('loading');
        
        document.getElementById('welcomeTime').textContent = new Date().toLocaleTimeString('ar');
        
        function addMessage(message, isUser) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'assistant-message'}`;
            
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = message;
            
            const time = document.createElement('div');
            time.className = 'message-time';
            time.textContent = new Date().toLocaleTimeString('ar');
            
            messageDiv.appendChild(bubble);
            messageDiv.appendChild(time);
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        async function sendMessage() {
            const message = chatInput.value.trim();
            if (!message) return;
            
            addMessage(message, true);
            chatInput.value = '';
            loading.style.display = 'block';
            
            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message, top_k: 3 })
                });
                
                const data = await response.json();
                loading.style.display = 'none';
                addMessage(data.response, false);
            } catch (error) {
                loading.style.display = 'none';
                addMessage('عذراً، حدث خطأ. حاول مرة أخرى.', false);
            }
        }
        
        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
        
        async function checkHealth() {
            try {
                const response = await fetch('/health');
                if (response.ok) {
                    document.getElementById('status').innerHTML = '🟢 متصل';
                } else {
                    document.getElementById('status').innerHTML = '🔴 غير متصل';
                }
            } catch (error) {
                document.getElementById('status').innerHTML = '🔴 غير متصل';
            }
        }
        
        checkHealth();
        setInterval(checkHealth, 30000);
    </script>
</body>
</html>

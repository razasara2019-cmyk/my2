services:
  - type: web
    name: silent-guardian-lite
    runtime: python
    repo: https://github.com/YOUR_USERNAME/silent-guardian-lite
    branch: main
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: PORT
        value: 10000
